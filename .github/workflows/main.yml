name: Pipeline de Testes QA

# Define quando o pipeline será executado
on:
  push:
    branches: [ "main", "master" ] # Roda quando você faz 'git push'
  pull_request:
    branches: [ "main", "master" ] # Roda quando abre um Pull Request

jobs:
  testes:
    runs-on: ubuntu-latest # Usa um servidor Linux do GitHub

    steps:
    - name: Passo 1 - Baixar código do repositório
      uses: actions/checkout@v4

    - name: Passo 2 - Configurar Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Passo 3 - Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install pytest pandas streamlit openai plotly anyio
        # Se você tiver o arquivo requirements.txt, use a linha abaixo:
        # pip install -r requirements.txt

    - name: Passo 4 - Executar Testes com Pytest
      run: |
        python -m pytest -v